[workspace]
resolver = "2"
members = [
    "crates/gitvur-schema",
    "crates/gitvur-index",
    "crates/gitvur-validate",
    "crates/gitvur-diff",
    "crates/gitvur-cli",
    "crates/gitvur-flow",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gitvur-schema = { path = "crates/gitvur-schema" }
gitvur-index = { path = "crates/gitvur-index" }
gitvur-validate = { path = "crates/gitvur-validate" }
gitvur-diff = { path = "crates/gitvur-diff" }
gitvur-flow = { path = "crates/gitvur-flow" }
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow-list, kept short on purpose:
# - must_use_candidate: fires on nearly every pure function; we add #[must_use]
#   by hand where ignoring a result is a real bug.
# - missing_errors_doc: internal crates return typed errors whose variants are
#   documented on the error type; repeating them on every fn adds noise.
# - similar_names: extractor/diff code legitimately pairs names like
#   `from_id`/`to_id` and `node_a`/`node_b`.
must_use_candidate = "allow"
missing_errors_doc = "allow"
similar_names = "allow"

[package]
name = "gitvur-app"
description = "Gitvur desktop viewer (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gitvur-schema = { workspace = true, features = ["ts"] }
gitvur-index.workspace = true
gitvur-validate.workspace = true
gitvur-diff.workspace = true
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = "12.0.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "gitvur-schema"
description = "Gitvur data contract v0.2: Rust types and JSON Schema."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ts-rs = { version = "12.0.1", optional = true }

[features]
# TypeScript bindings for the app (derive attributes only).
ts = ["dep:ts-rs"]
